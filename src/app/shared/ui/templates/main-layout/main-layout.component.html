<div class="main-layout">
  @if (isFolioRoute() && activeFolio() && quoteState()?.sections) {
    <app-stepper
      [folio]="activeFolio()!"
      [sections]="quoteState()!.sections"
      [activeRoute]="activeRoute()"
    />
  }

  <main class="main-layout__content">
    <router-outlet />
  </main>

  @if (isFolioRoute() && quoteState()) {
    <app-status-bar [state]="quoteState()!" />
  }
</div>
