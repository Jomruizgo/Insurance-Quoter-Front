<header class="app-header">
  <!-- Brand + Breadcrumb -->
  <div class="app-header__left">
    <a [routerLink]="['/cotizador']" class="app-header__logo">
      <div class="app-header__logo-mark">IQ</div>
      <div class="app-header__logo-text">
        <span class="app-header__logo-name">Sofka IQ</span>
        <span class="app-header__logo-sub">Cotizador de Daños</span>
      </div>
    </a>

    <nav class="app-header__breadcrumb" aria-label="Migas de pan">
      <span class="app-header__sep">/</span>
      <a [routerLink]="['/cotizador']" class="app-header__bc-link">Cotizaciones</a>
      @if (folioNumber) {
        <span class="app-header__sep">/</span>
        <span class="app-header__bc-current">{{ folioNumber }}</span>
      }
    </nav>
  </div>

  <!-- Spacer -->
  <div class="app-header__grow"></div>

  <!-- Actions -->
  <div class="app-header__actions">
    <!-- Search -->
    <div class="app-header__search">
      <app-icon name="search" [size]="13" className="app-header__search-icon" />
      <input
        type="text"
        class="app-header__search-input"
        placeholder="Buscar…"
        aria-label="Buscar (⌘K)"
      />
      <kbd class="kbd">⌘K</kbd>
    </div>

    <!-- Preferences (cog) -->
    <button class="btn btn--ghost btn--icon" aria-label="Preferencias" type="button">
      <app-icon name="cog" [size]="15" />
    </button>

    <!-- Tweaks panel -->
    <app-tweaks-panel />

    <!-- Profile -->
    <div class="app-header__divider"></div>
    <div class="app-header__profile">
      <div class="app-header__avatar">
        {{ userName.charAt(0).toUpperCase() }}
      </div>
      <div class="app-header__user-info">
        <span class="app-header__user-name">{{ userName }}</span>
        <span class="app-header__user-role">{{ userRole }}</span>
      </div>
    </div>
  </div>
</header>
