<header class="app-header">
  <div class="app-header__brand">
    <a [routerLink]="['/cotizador']" class="app-header__logo">
      <span class="app-header__logo-mark">IQ</span>
      <span class="app-header__logo-text">Sofka IQ / Cotizador de Daños</span>
    </a>

    <nav class="app-header__breadcrumb" aria-label="Migas de pan">
      <a [routerLink]="['/cotizador']" class="app-header__breadcrumb-link">Cotizaciones</a>
      @if (folioNumber) {
        <span class="app-header__breadcrumb-sep">
          <app-icon name="chevron-right" [size]="14" />
        </span>
        <span class="app-header__breadcrumb-current">{{ folioNumber }}</span>
      }
    </nav>
  </div>

  <div class="app-header__actions">
    <div class="app-header__search" role="search">
      <app-icon name="search" [size]="16" className="app-header__search-icon" />
      <input
        type="text"
        class="app-header__search-input"
        placeholder="Buscar…"
        aria-label="Buscar (⌘K)"
      />
      <kbd class="app-header__search-kbd">⌘K</kbd>
    </div>

    <div class="app-header__profile">
      <div class="app-header__avatar" aria-label="Perfil de usuario">
        {{ userName.charAt(0).toUpperCase() }}
      </div>
      <div class="app-header__user-info">
        <span class="app-header__user-name">{{ userName }}</span>
        <span class="app-header__user-role">{{ userRole }}</span>
      </div>
    </div>
  </div>
</header>
