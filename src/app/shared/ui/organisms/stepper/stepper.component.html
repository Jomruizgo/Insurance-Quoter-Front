<div class="stepper" style="flex-wrap: wrap">
  @for (step of steps; track step.key; let i = $index) {
    <div
      class="step"
      [attr.data-complete]="statusOf(step.key) === 'COMPLETE'"
      [attr.aria-current]="isActive(step.route)"
      (click)="navigate(step.route)"
      (keydown.enter)="navigate(step.route)"
      role="button"
      tabindex="0"
    >
      <div class="step-num">
        @if (statusOf(step.key) === 'COMPLETE') {
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M20 6 9 17l-5-5"/>
          </svg>
        } @else {
          {{ i + 1 }}
        }
      </div>
      <span>{{ step.label }}</span>
      @if (statusOf(step.key) === 'INCOMPLETE') {
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="color: var(--warn); flex-shrink: 0" aria-label="Incompleto">
          <path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/>
          <path d="M12 9v4M12 17h.01"/>
        </svg>
      }
    </div>
    @if (i < steps.length - 1) {
      <div class="step-sep" aria-hidden="true"></div>
    }
  }
</div>
