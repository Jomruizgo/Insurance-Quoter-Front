version: "3.9"

services:

  # Development server with hot reload — mounts src/ as volume
  # Usage: docker-compose up dev
  dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "4200:4200"
    volumes:
      - ./src:/app/src:delegated
      - ./proxy.conf.json:/app/proxy.conf.json:ro
    environment:
      - CHOKIDAR_USEPOLLING=true
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: >
      node_modules/.bin/ng serve
      --host 0.0.0.0
      --poll 500
      --proxy-config proxy.conf.json

  # Production build served via nginx — mirrors the real deployment
  # Usage: docker-compose up prod
  prod:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "4200:80"

  # Run unit tests once and exit (CI mode)
  # Usage: docker-compose run --rm test
  test:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: >
      node_modules/.bin/ng test
      --watch=false
      --browsers=ChromeHeadless
    environment:
      - CHROME_BIN=/usr/bin/chromium-browser
